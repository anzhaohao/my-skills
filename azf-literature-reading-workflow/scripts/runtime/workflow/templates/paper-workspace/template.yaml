version: "2.0.0"
name: "paper-workspace-starter"
notes:
  - "【总览】{中文题名}.md"
  - "【中译】{中文题名}.md"
attachments:
  source_pdf: "附件/原文/【原文】{中文题名}.pdf"
  english_mineru_markdown: "附件/原文/【MinerU原文】{中文题名}.md"
chinese_source_policy: "Merge MinerU Markdown into 阅读工作台/【中译】{中文题名}.md; do not retain a separate MinerU Markdown in the vault."
machine_artifacts: "External artifact_root only; retain run-manifest.json, state/, parser/, and logs/."
generated_manual_boundary: "Generated content must be bounded or whole-file owned; human note sections are preserved. Note filenames carry the title; note bodies omit duplicate title headings."
